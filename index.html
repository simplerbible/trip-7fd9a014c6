const db=()=>new Promise((r,j)=>{const q=indexedDB.open("trip",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const iget=async k=>{try{const d=await db();return await new Promise(r=>{const g=d.transaction("k").objectStore("k").get(k);g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})}catch(_){return null}};
const iput=async(k,v)=>{try{const d=await db();await new Promise(r=>{const t=d.transaction("k","readwrite");v===undefined?t.objectStore("k").delete(k):t.objectStore("k").put(v,k);t.oncomplete=r;t.onerror=r})}catch(_){}};
const show=h=>{document.open();document.write(h);document.close()};
const ub=async s=>new Uint8Array(await (await fetch("data:application/octet-stream;base64,"+s)).arrayBuffer());
const dec=async k=>{const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,await ub(D.c));return D.z?await new Response(new Blob([p]).stream().pipeThrough(new DecompressionStream("gzip"))).text():new TextDecoder().decode(p)};
function unlockUI(){document.getElementById("sp").style.display="none";const c=document.querySelector(".c");c.style.display="block"}const u=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
async function go(pw,auto){try{const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
const h=await dec(k);await iput("page",{s:D.s,key:k});await iput("sync",undefined);
localStorage.setItem("trip_k","1");try{sessionStorage.setItem("trip_pw_s",pw)}catch(_){}show(h)}
catch(x){if(auto){localStorage.removeItem("trip_pw");localStorage.removeItem("trip_k");unlockUI()}else{document.getElementById("e").textContent="Wrong password"}}}
(async()=>{const c=await iget("page");if(c&&c.s===D.s&&c.key){try{show(await dec(c.key));return}catch(_){}}const s=localStorage.getItem("trip_pw");if(s){go(s,true);return}localStorage.removeItem("trip_k");unlockUI()})();
document.getElementById("b").onclick=()=>go(document.getElementById("p").value);
document.getElementById("p").onkeydown=e=>{if(e.key==="Enter")go(e.target.value)};</script></body></html>
